<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<base href="../../">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Clubbo · Démo Handball</title>
<meta name="description" content="Clubbo : l'appli des éducateurs du club (équipes, séances, matchs, parents, statistiques)">
<meta name="theme-color" content="#0e1d45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Démo Handball">
<link rel="manifest" href="demo/hand/manifest.webmanifest">
<link rel="icon" href="icons/ea-logo.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="app.css?v=138">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <a class="brand" href="#/"><span class="crest-live coin crest-coin" title=""><span class="coin-in"><span class="coin-face coin-front"><img class="crest" src="icons/ea-logo.png" alt="Blason du club"></span><span class="coin-face coin-back" id="brandBack"></span></span></span><span id="clubName">Clubbo</span></a>
    <nav id="nav" aria-label="Menu"></nav>
    <div class="rail-user" id="railUser"></div>
  </aside>
  <main id="view" tabindex="-1"></main>
</div>
<div id="lock" class="lock" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="busy" class="busy" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/config.js?v=138"></script>
<script>CLUB_SERVER.store = 'demo-hand'; CLUB_SERVER.db = 'demo-hand'; CLUB_SERVER.demo = 'hand';
/* <base> makes the files load from the app's folder; a link « #/… » would then open the main app: keep it on this page */
window.addEventListener('click', function (e) { var a = !e.defaultPrevented && e.target.closest && e.target.closest('a[href^="#"]'); if (!a || a.target) return; e.preventDefault(); var h = a.getAttribute('href'); if (h.length > 1) location.hash = h; });</script>
<script src="js/app.bundle.js?v=138"></script>
<script>/* (3.75) safety net: a page that has not started after 15 s shows a button to reload (login and data are kept) */
setTimeout(function () { if (window.__appStarted || document.getElementById('app-stuck')) return;
  document.body.insertAdjacentHTML('beforeend', '<div id="app-stuck" style="position:fixed;left:16px;right:16px;bottom:96px;z-index:300;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;background:#0e1d45;color:#fff;font:15px system-ui"><span>L\'appli met du temps à s\'ouvrir.</span><button style="font:inherit;padding:10px 14px;border-radius:10px;border:0;background:#8c1024;color:#fff" onclick="location.reload()">Recharger</button></div>');
}, 15000);</script>
</body>
</html>
